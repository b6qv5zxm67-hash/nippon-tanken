<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>にっぽんたんけん図鑑</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE すごろくの前に、一人で調べて練習する。やさしく、元気に。授業でも家でも
   IDEA 探検隊の図鑑ノート：地図を押すと、その県のページが開く。練習でスタンプがたまる
   PICTURE 海の上に浮かぶ地方の地図（すごろくと同じ地図）。県や名所を押して調べる
   COLOUR 海の青が地、地方の色で県をぬる。黄色はスタンプとクリア
   TYPE Dela Gothic One（見出し）+ M PLUS Rounded 1c（本文）
   LAYOUT 広い画面は左に地図、右に図鑑のページ。せまい画面は 地図→ページ */
:root{color-scheme:light;--sea1:#2a93dc;--sea2:#1766b0;--ink:#1c2430;--sub:#56616f;--card:#fff;--line:#d9e4ef;--yel:#ffc928;--red:#e5432f;--grn:#2fa35a;--blu:#2f7fd6}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:linear-gradient(180deg,var(--sea1),var(--sea2)) fixed;color:var(--ink);font:16px/1.6 "M PLUS Rounded 1c",system-ui,sans-serif;overflow-x:clip;min-height:100vh}
button{font:inherit;color:inherit}
h1{font:400 clamp(24px,3.6vw,36px)/1.1 "Dela Gothic One",sans-serif;color:#fff;margin:0;text-shadow:0 3px 0 #0d4a85}
h2{font-size:20px;margin:0 0 8px;line-height:1.3}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:14px max(2vw,14px) 6px;max-width:1280px;margin:0 auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.tab{border:0;border-radius:14px 14px 4px 4px;padding:8px 16px;min-height:46px;font-weight:800;cursor:pointer;background:rgba(255,255,255,.25);color:#fff}
.tab[aria-selected=true]{background:#fff;color:var(--ink)}
.regs{display:flex;gap:6px;overflow-x:auto;padding:6px max(2vw,14px) 10px;max-width:1280px;margin:0 auto;scrollbar-width:thin}
.reg{flex:none;border:0;border-radius:999px;padding:6px 14px;min-height:44px;font-weight:800;cursor:pointer;background:#fff;border-left:8px solid var(--c);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.reg[aria-pressed=true]{background:var(--c);color:#fff}
.reg small{font-weight:700;opacity:.8;margin-left:4px}
main{max-width:1280px;margin:0 auto;padding:0 max(2vw,14px) 30px}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,1fr);gap:14px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.mapbox{background:rgba(255,255,255,.12);border-radius:20px;padding:6px}
.mapbox svg{display:block;width:100%;height:auto;max-height:72vh}
.pf{cursor:pointer}.pf:hover{filter:brightness(1.08)}
.dotp{cursor:pointer}
.btn{border:0;border-radius:14px;padding:10px 18px;min-height:46px;font-weight:800;cursor:pointer;background:var(--red);color:#fff;box-shadow:0 4px 0 #9b2416}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9b2416}
.btn.blue{background:var(--blu);box-shadow:0 4px 0 #1b4f8d}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.small{min-height:40px;padding:6px 12px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:#f5f8fb;border-radius:999px;padding:4px 12px;min-height:40px;font-weight:700;cursor:pointer;font-size:15px}
.chip.seen{background:#fff4cc;border-color:var(--yel)}
.chip.spot{border-style:dashed}
.prog{height:12px;border-radius:999px;background:var(--line);overflow:hidden;margin:6px 0 10px}
.prog i{display:block;height:100%;background:var(--yel)}
.page h3{font:400 clamp(26px,3vw,34px)/1.15 "Dela Gothic One",sans-serif;margin:4px 0 2px}
.tag{display:inline-block;border-radius:999px;padding:2px 12px;font-weight:800;font-size:14px;color:#fff;background:var(--c,var(--blu))}
.head{display:flex;gap:14px;align-items:center}
.shape{width:120px;height:120px;flex:none;background:#eef5fb;border-radius:16px;padding:8px}
.rows{display:grid;gap:10px;margin-top:12px}
.row{display:grid;grid-template-columns:6.5em minmax(0,1fr);gap:8px;align-items:start;border-top:1px dashed var(--line);padding-top:8px}
.row>b{color:var(--sub);font-size:14px}
.items{display:flex;flex-wrap:wrap;gap:8px}
.item{display:grid;justify-items:center;gap:2px;padding:6px 8px;border:2px solid var(--line);border-radius:14px;background:#fff;font-weight:800;font-size:14px;min-width:80px;text-align:center}
button.item{cursor:pointer}
.item small{font-weight:500;color:var(--sub);font-size:12.5px;max-width:9em;line-height:1.35}
.ic{width:52px;height:52px}.ic.big{width:96px;height:96px}
.pimg{object-fit:cover;border-radius:12px;width:84px;height:84px}.pimg.big{width:170px;height:170px;border-radius:18px}.res .pimg{width:110px;height:110px}
.why{background:#fff8dc;border-radius:14px;padding:10px 12px;margin-top:12px;font-weight:700}
.hint{color:var(--sub);font-size:14px;margin:6px 0 0}
.wiki{font-size:14px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:10px 0}
.mode{border:3px solid var(--line);background:#f7fafd;border-radius:18px;padding:12px;text-align:left;cursor:pointer;min-height:92px}
.mode b{font-size:20px;display:block}
.rkc{border:2px solid var(--line);background:#f5f8fb;border-radius:12px;padding:4px 10px;font-size:14px;font-weight:700}.rkc b{font-size:17px}.rkc small{color:var(--sub);font-weight:500}.rkc.rhi{background:#fff4cc;border-color:var(--yel)}
.rk{display:grid;gap:6px;margin:8px 0}.rk div{display:grid;grid-template-columns:8em minmax(0,1fr) auto;gap:8px;align-items:center;font-weight:700}.rk i{display:block;height:16px;border-radius:999px;background:var(--blu)}.rk div.hit i{background:var(--yel)}.rk div.hit span{color:#a07800}.rk b{white-space:nowrap}.mode small{color:var(--sub);display:block;line-height:1.4}
.mode .st{color:#a07800;font-weight:800}
.mode:disabled{opacity:.5;cursor:not-allowed}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.q{font-size:clamp(22px,3vw,30px);font-weight:800;line-height:1.35;margin:8px 0 12px}
.qfig{display:block;margin:0 auto 12px;height:min(32vh,240px);width:auto;max-width:100%;border-radius:14px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:520px){.choices{grid-template-columns:minmax(0,1fr)}}
.ch{border:3px solid var(--line);background:#f7fafd;border-radius:16px;padding:12px;font-size:clamp(18px,2.4vw,24px);font-weight:800;min-height:62px;cursor:pointer;text-align:left}
.ch.ok{border-color:var(--grn);background:#e3f6e9}.ch.ng{border-color:var(--red);background:#fde7e3}.ch.gone{visibility:hidden}
.res{margin-top:12px;border-radius:16px;padding:12px 14px;background:#f3f7fb}
.res p{margin:2px 0}.big{font-size:clamp(22px,3vw,28px);font-weight:800}
.bar{display:flex;gap:4px;margin:6px 0}.bar i{flex:1;height:10px;border-radius:999px;background:var(--line)}
.bar i.o{background:var(--grn)}.bar i.x{background:var(--red)}.bar i.n{background:var(--yel)}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:center}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.rcard{border-radius:18px;padding:12px;background:#fff;border:3px solid var(--line)}
.rcard.done{border-color:var(--yel);background:#fffbea}
.rcard h4{margin:0 0 8px;font-size:18px;display:flex;align-items:center;gap:8px}
.st4{display:flex;gap:8px;flex-wrap:wrap}
.stamp{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;line-height:1.15;text-align:center;border:3px dashed var(--line);color:#9aa6b3}
.stamp.on{border:3px solid var(--c);background:var(--c);color:#fff;transform:rotate(-8deg)}
.medal{width:34px;height:34px;flex:none}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0 14px}
.num{background:#f3f7fb;border-radius:16px;padding:10px 12px}.num b{font:400 30px/1.1 "Dela Gothic One",sans-serif;display:block}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.vid{background:#fff;border-radius:18px;padding:12px;border-left:10px solid var(--c)}
.vid video{width:100%;border-radius:12px;background:#000;display:block;margin-top:8px}
.soon{display:grid;place-items:center;aspect-ratio:16/9;border-radius:12px;background:#eef3f8;color:var(--sub);font-weight:800;margin-top:8px;text-align:center;padding:10px}
.foot{color:#e6f1fb;font-size:13px;padding:6px max(2vw,14px) 20px;max-width:1280px;margin:0 auto}
.foot a{color:#fff}
.ov{position:fixed;inset:0;background:rgba(8,30,60,.55);display:grid;place-items:center;padding:16px;z-index:10}
.modal{background:#fff;border-radius:22px;padding:20px;width:min(520px,100%)}
[hidden]{display:none!important}
.pop{animation:pop .5s ease-out}@keyframes pop{0%{transform:scale(.6) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:1}}
@media(prefers-reduced-motion:reduce){.pop{animation:none}}

/* ---------- れんしゅう ---------- */
const nearOpts=(n,k)=>{const d=ndist(n),r=PN[n].r;return shuffle(P.filter(x=>x.n!==n).sort((a,b)=>(a.r===r?0:1)-(b.r===r?0:1)||d[a.n]-d[b.n]).slice(0,k).map(x=>x.n)).slice(0,3)};
const mk=(t,n)=>{if(t==="rank")return rankQ(n)||rankQ(n)||rankQ("東京");const ex=ken(n)+"（"+REGIONS[PN[n].r]+"・"+capOf(n)+"）："+PN[n].why;
  if(t==="shape")return{t,n,q:"この形は、どの都道府県？",fig:shapeSVG(n,"qfig","#e5432f"),ch:shuffle([n,...nearOpts(n,6)]).map(ken),ans:ken(n),ex};
  if(t==="map"&&REG!=="all")return{t,n,tap:true,q:`「${ken(n)}」は どこ？ 地図で押そう`,ans:ken(n),ex};
  if(t==="map"){const [x,y,w,h]=pathBox(MAPP[n]),s=Math.max(w,h,180)*2.8,cx=x+w/2,cy=y+h/2;
    const land=Object.entries(MAPP).map(([k,d])=>`<path d="${d}" fill="${k===n?"#e5432f":"#e3eadb"}" stroke="${k===n?"#1c2430":"#8aa0b5"}" stroke-width="${k===n?2.5:1}" vector-effect="non-scaling-stroke"/>`).join("");
    return{t,n,q:"地図で赤い色の県は、どこ？",fig:`<svg class="qfig" viewBox="${cx-s*.65} ${cy-s/2} ${s*1.3} ${s}" aria-label="地図"><rect x="${cx-s}" y="${cy-s}" width="${2*s}" height="${2*s}" fill="#bfe0f7"/>${land}<path d="${LAKEP}" fill="#bfe0f7"/></svg>`,ch:shuffle([n,...nearOpts(n,6)]).map(ken),ans:ken(n),ex}}
  const sp=SP[n],pool=(SPOTS.filter(x=>x.r===sp.r&&x.n!==n).length>=3?SPOTS.filter(x=>x.r===sp.r):SPOTS).filter(x=>x.n!==n),o=shuffle(pool).slice(0,3),ex2=n+"（"+[sp.p,sp.p2].filter(Boolean).map(ken).join("・")+"）："+sp.f;
  return Math.random()<.5?{t,n,q:`「${sp.f}」で知られているのは、どこ？`,ch:shuffle([n,...o.map(x=>x.n)]),ans:n,ex:ex2,icon:STIC[n]}
    :{t,n,q:`「${n}」で知られているのは？`,ch:shuffle([sp.f,...o.map(x=>x.f)]),ans:sp.f,ex:ex2,icon:STIC[n]};
};
function startRound(t,only){
  let ns=only||(t==="rank"?Array.from({length:10},()=>rnd(prefsOf(REG)).n):t==="spot"?shuffle(spotsIn(REG).map(s=>s.n)).slice(0,REG==="all"?10:8):shuffle(prefsOf(REG).map(p=>p.n)).slice(0,REG==="all"?10:47));
  Q={t,reg:REG,list:ns.map(n=>mk(t,n)),i:0,res:[],retry:!!only,hint:false,done:false};render();
}
function drawDrill(){
  if(Q&&Q.reg===REG)return drawQ();
  Q=null;const ms=modesFor(REG);
  $("main").innerHTML=`<div class="panel"><h2>${RNAME(REG)}で れんしゅう</h2>
   <p style="margin:0">やりたい練習をえらぼう。${REG==="all"?"全国は10問です。":"地方の県を全部出します（名所あては8問、ランキングは10問）。"}全部正解で、きろくにスタンプ！</p>
   <div class="modes">${Object.entries(MODES).map(([k,m])=>{const id=k+"-"+REG,b=R.best[id];return `<button class="mode" data-m="${k}" ${ms.includes(k)?"":"disabled"}><b>${m.t}</b><small>${m.d}</small>
     <small class="st">${R.clear[id]?"★ クリア！":b!=null?"さいこう "+b+"問正解":ms.includes(k)?"まだ やっていない":"北海道地方は名所あてで練習しよう"}</small></button>`}).join("")}</div>
   <p class="hint">${REG==="all"?"地図あては、地方をえらぶと「地図を押して答える」練習になります。":"地図あては、地図の県を押して答えます。"}</p></div>`;
}
function drawQ(){
  const q=Q.list[Q.i];
  if(Q.done){
    const ok=Q.res.filter(Boolean).length,n=Q.list.length,ng=Q.list.filter((x,i)=>!Q.res[i]).map(x=>x.n),id=Q.t+"-"+Q.reg,perfect=ok===n&&!Q.retry;
    const newClear=perfect&&!R.clear[id];
    if(!Q.saved){Q.saved=1;if(!Q.retry)R.best[id]=Math.max(R.best[id]||0,ok);if(perfect)R.clear[id]=1;save()}
    $("main").innerHTML=`<div class="panel"><h2>${RNAME(Q.reg)}・${MODES[Q.t].t}</h2>
      <p class="big">${n}問中 ${ok}問 正解！</p>${barHTML()}
      ${perfect?`<p class="big" style="color:#a07800">${newClear?"★ スタンプゲット！":"★ 全部正解！"}</p>`:Q.retry?`<p>まちがえた問題の練習でした。全部正解でスタンプをもらうには、もう一度はじめからやってみよう。</p>`:""}
      ${ng.length?`<p style="margin:8px 0 4px;font-weight:800">まちがえたもの</p><div class="chips">${ng.map(x=>`<button class="chip" ${Q.t==="spot"?`data-s="${esc(x)}"`:`data-p="${x}"`}>${Q.t==="spot"?esc(x):ken(x)}</button>`).join("")}</div><p class="hint">押すと図鑑で調べられます。</p>`:""}
      <div class="acts">${ng.length?`<button class="btn" id="retry">まちがえたものだけ もう一回</button>`:""}<button class="btn blue" id="again">はじめから もう一回</button><button class="btn ghost" id="back">練習をえらぶ</button></div></div>`;
    if($("retry"))$("retry").onclick=()=>startRound(Q.t,shuffle(ng));
    $("again").onclick=()=>startRound(Q.t);$("back").onclick=()=>{Q=null;render()};return;
  }
  const answered=Q.res.length>Q.i;
  $("main").innerHTML=`<div class="${q.tap?"grid":""}">${q.tap?`<div class="mapbox" id="tapmap">${mapSVG(REG,"tap",Q.mark)}</div>`:""}
   <div class="panel"><div class="qtop"><span class="tag" style="--c:${REG==="all"?"#1c2430":RCOL[REG]}">${RNAME(Q.reg)}・${MODES[Q.t].t}${Q.retry?"（まちがえた問題）":""}</span><span style="font-weight:800">${Q.i+1} / ${Q.list.length}</span></div>${barHTML()}
   <p class="q">${esc(q.q)}</p>${q.fig||""}
   ${q.tap?`<p class="hint">${Q.hint?"ヒント：県庁所在地は「"+esc(capOf(q.n))+"」":"わからないときは、ヒントを使おう。"}</p>`:
     `<div class="choices">${q.ch.map(c=>`<button class="ch ${answered?(c===q.ans?"ok":c===Q.pick?"ng":""):(Q.hide&&Q.hide.includes(c)?"gone":"")}" data-c="${esc(c)}" ${answered?"disabled":""}>${esc(c)}</button>`).join("")}</div>`}
   <div id="resBox">${answered?resHTML(q):`<div class="acts"><button class="btn ghost small" id="hintBtn" ${Q.hint?"disabled":""}>ヒント</button><button class="btn ghost small" id="quit">やめる</button></div>`}</div></div></div>`;
  if(!answered){
    $("hintBtn").onclick=()=>{Q.hint=true;if(!q.tap)Q.hide=shuffle(q.ch.filter(c=>c!==q.ans)).slice(0,2);render()};
    $("quit").onclick=()=>{Q=null;render()};
    $("main").querySelectorAll(".ch").forEach(b=>b.onclick=()=>answer(b.dataset.c));
    if(q.tap)$("tapmap").onclick=e=>{const p=e.target.closest("[data-p]");if(p)answer(ken(p.dataset.p),p.dataset.p)};
  }else{$("next").onclick=next;$("next").focus()}
}
const barHTML=()=>`<div class="bar">${Q.list.map((x,i)=>`<i class="${Q.res[i]===true?"o":Q.res[i]===false?"x":i===Q.i&&!Q.done?"n":""}"></i>`).join("")}</div>`;
const resHTML=q=>{const ok=Q.res[Q.i];return `<div class="res"><p class="big" style="color:${ok?"var(--grn)":"var(--red)"}">${ok?"正解！":"ざんねん…"}</p>
  ${q.vals?`<div class="rk">${q.vals.map((v,i)=>`<div${v[3]?' class="hit"':""}><span>${esc(v[0])}</span><i style="width:${Math.max(3,v[1]/q.vals[0][1]*100)}%"></i><b>${esc(v[2])}</b></div>`).join("")}</div>`:""}<div style="display:flex;gap:10px;align-items:center">${q.icon?pic(q.n,q.icon,"ic"):q.t!=="spot"&&q.t!=="rank"?shapeSVG(q.n,"shape"):""}<p>答え：<b>${esc(q.ans)}</b><br>${esc(q.ex)}</p></div></div>
  <div class="acts"><button class="btn" id="next">${Q.i+1<Q.list.length?"つぎの問題":"けっかを見る"}</button></div>`};
function answer(c,tapped){
  const q=Q.list[Q.i];if(Q.res.length>Q.i)return;const ok=c===q.ans;Q.res.push(ok);Q.pick=c;
  if(q.tap){Q.mark={[q.n]:"ok"};if(!ok&&tapped)Q.mark[tapped]="ng"}
  R.ans++;if(ok)R.ok++;const d=today();if(!R.days.includes(d))R.days.push(d);if(R.days.length>400)R.days=R.days.slice(-400);
  save();render();
}
function next(){Q.i++;Q.hint=false;Q.hide=null;Q.mark=null;Q.pick=null;if(Q.i>=Q.list.length)Q.done=true;render();window.scrollTo({top:0,behavior:"smooth"})}

     <div class="st4">${stampsOf(r).map(s=>`<span class="stamp ${s.on?"on pop":""}">${s.t}${s.on?"<br>★":""}</span>`).join("")}</div></div>`).join("")}</div>

    $("no").onclick=()=>{$("ov").hidden=true};$("yes").onclick=()=>{Object.assign(R,{seen:{},spot:{},clear:{},best:{},days:[],ans:0,ok:0});save();$("ov").hidden=true;render()}};
}

/* ---------- 全体 ---------- */
function render(){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.v===V));
  drawRegs();({zukan:drawZukan,drill:drawDrill,video:drawVideo,rec:drawRec})[V]();
}
$("main").addEventListener("click",e=>{
  if(V==="drill"&&Q&&!Q.done)return;
  const m=e.target.closest("[data-m]");if(m){startRound(m.dataset.m);return}
  const zr=e.target.closest("[data-zr]");if(zr){V="zukan";REG=+zr.dataset.zr;SEL=null;render();return}
  const gv=e.target.closest("[data-go]");if(gv){V=gv.dataset.go;render();return}
  const p=e.target.closest("[data-p]"),s=e.target.closest("[data-s]");
  if(p||s){if(V!=="zukan"){V="zukan";Q=null}openSel(p?"p":"s",p?p.dataset.p:s.dataset.s)}
});
$("ov").onclick=e=>{if(e.target===$("ov"))$("ov").hidden=true};
const fromHash=()=>{const h=location.hash.slice(1);if(["zukan","drill","video","rec"].includes(h))V=h};
addEventListener("hashchange",()=>{fromHash();render()});
fromHash();render();
}
</script></body></html>
